spring.application.name=gateway
server.port=8083

spring.config.import=optional:configserver:http://localhost:8888

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Disable automatic discovery routes
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=false

# Order Service
spring.cloud.gateway.server.webmvc.routes[0].id=order-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ORDER
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/orders/**

# Payment Service
spring.cloud.gateway.server.webmvc.routes[1].id=payment-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PAYMENT
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/payments/**


# Razorpay Webhook Route
spring.cloud.gateway.server.webmvc.routes[2].id=payment-webhook
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PAYMENT
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/webhooks/**

jwt.secret=${STREAMGUARD_JWT_SECRET}
jwt.expiration=3600

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5435/streamguard
spring.datasource.username=postgres
spring.datasource.password=streamguard123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.reactor.netty=DEBUG