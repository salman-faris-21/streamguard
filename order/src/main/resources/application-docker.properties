spring.application.name=order
server.port=8086

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/streamguard
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Config Server
spring.config.import=optional:configserver:http://config-server:8888

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Kafka
spring.kafka.bootstrap-servers=kafka:29092

# Kafka Consumer
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.order
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.order.order.event.PaymentEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.auto-offset-reset=earliest