services:
  postgres:
    image: postgres:18.6-alpine
    container_name: streamguard-postgres
    environment:
      POSTGRES_DB: streamguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: streamguard123
    ports:
      - "5435:5432"
    volumes:
      - streamguard_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: streamguard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@streamguard.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      - postgres
  kafka:
    image: apache/kafka:latest
    container_name: streamguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  streamguard_data: