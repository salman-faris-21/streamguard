spring.application.name=payment
server.port=8084

# Config Server
spring.config.import=optional:configserver:http://config-server:8888

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/streamguard
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Kafka Broker
spring.kafka.bootstrap-servers=kafka:29092

# Kafka Producer Serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Outbox Configuration
streamguard.outbox.max-retries=8
streamguard.outbox.initial-backoff-ms=5000
streamguard.outbox.max-backoff-ms=300000
streamguard.outbox.poll-interval-ms=5000

logging.level.com.example.payment.payment.outbox=ERROR

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true