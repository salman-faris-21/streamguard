
services:

  # ---------------- POSTGRES ----------------
  postgres:
    image: postgres:18.6-alpine
    container_name: streamguard-postgres
    environment:
      POSTGRES_DB: streamguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - streamguard_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streamguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------- PGADMIN ----------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: streamguard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@streamguard.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- KAFKA ----------------
  kafka:
    image: apache/kafka:latest
    container_name: streamguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  # ---------------- CONFIG SERVER ----------------
  config-server:
    image: salmanfaris21/streamguard-config-server:latest
    container_name: streamguard-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./streamguard-config:/config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- EUREKA ----------------
  eureka-server:
    image: salmanfaris21/streamguard-eureka:latest
    container_name: streamguard-eureka
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - config-server
    restart: unless-stopped

  # ---------------- PAYMENT ----------------
  payment:
    image: salmanfaris21/streamguard-payment:latest
    container_name: streamguard-payment
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      STREAMGUARD_JWT_SECRET: ${STREAMGUARD_JWT_SECRET}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      - kafka
      - eureka-server
      - config-server
      - postgres
    restart: unless-stopped

  # ---------------- ORDER ----------------
  order:
    image: salmanfaris21/streamguard-order:latest
    container_name: streamguard-order
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      STREAMGUARD_JWT_SECRET: ${STREAMGUARD_JWT_SECRET}
    depends_on:
      - kafka
      - eureka-server
      - config-server
      - postgres
    restart: unless-stopped

  # ---------------- API GATEWAY ----------------
  gateway:
    image: salmanfaris21/streamguard-gateway:latest
    container_name: streamguard-gateway
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      STREAMGUARD_JWT_SECRET: ${STREAMGUARD_JWT_SECRET}
    depends_on:
      - payment
      - order
      - eureka-server
      - config-server
    restart: unless-stopped

  # ---------------- FRONTEND ----------------
  frontend:
    build: ./Frontend
    container_name: streamguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  streamguard_data:
